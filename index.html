<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D War Strategy - Deep Customization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js" onerror="console.log('Socket.io недоступен - одиночный режим')"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #1a1a1a;
            color: #d1d5db;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #ui-panel {
            width: 450px;
            background-color: #1c1917;
            border-right: 2px solid #44403c;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 5px 0 25px rgba(0,0,0,0.8);
        }

        .panel-header {
            background-color: #292524;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #57534e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scrollable-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            background: linear-gradient(to bottom, #1c1917, #292524);
        }

        .scrollable-content::-webkit-scrollbar { width: 8px; }
        .scrollable-content::-webkit-scrollbar-track { background: #1c1917; }
        .scrollable-content::-webkit-scrollbar-thumb { background: #57534e; border-radius: 4px; }

        .slot-container {
            margin-bottom: 15px;
            border: 1px solid #44403c;
            border-radius: 6px;
            background-color: #292524;
            overflow: hidden;
        }

        .slot-header {
            background-color: #44403c;
            padding: 8px 12px;
            font-size: 0.9rem;
            color: #d6d3d1;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }
        
        .slot-header:hover { background-color: #57534e; }
        .slot-header.active { border-left: 4px solid #fbbf24; background-color: #57534e; }

        .slot-body {
            padding: 10px;
            display: none;
        }
        .slot-body.open { display: block; }

        .component-card {
            background-color: #292524;
            border: 1px solid #57534e;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .component-card:hover { border-color: #fbbf24; background-color: #44403c; }
        .component-card.selected {
            border-color: #fbbf24;
            background-color: #44403c;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.2) inset;
        }

        .component-icon {
            width: 45px;
            height: 45px;
            background-color: #1c1917;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            border: 1px solid #57534e;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .component-info { flex-grow: 1; }
        .component-info h4 { margin: 0 0 4px 0; color: #f5f5f4; font-size: 0.95rem; }
        .component-stats { font-size: 0.75rem; color: #a8a29e; display: flex; flex-wrap: wrap; gap: 6px; }
        .stat-item span { color: #fbbf24; }

        .action-bar {
            padding: 15px;
            background-color: #292524;
            border-top: 2px solid #57534e;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            background-color: #fbbf24;
            color: #1c1917;
            border: none;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover { background-color: #f59e0b; transform: translateY(-1px); }
        button.secondary { background-color: #57534e; color: #f5f5f4; }
        button.secondary:hover { background-color: #78716c; }

        #game-view {
            flex-grow: 1;
            position: relative;
            background-color: #000;
            cursor: crosshair;
        }
        
        canvas { display: block; width: 100%; height: 100%; }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            display: none;
        }

        .hud-panel {
            background-color: rgba(28, 25, 23, 0.85);
            border: 1px solid #57534e;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            backdrop-filter: blur(4px);
        }

        .bar-container {
            width: 200px;
            height: 14px;
            background-color: #1c1917;
            border: 1px solid #57534e;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .bar-fill {
            height: 100%;
            background-color: #22c55e;
            width: 100%;
            transition: width 0.2s, background-color 0.2s;
        }

        #mode-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(28, 25, 23, 0.85);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        #messages {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            gap: 8px;
        }

        .message {
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #44403c;
            animation: fadeOut 4s forwards;
            font-size: 1.1rem;
        }

        @keyframes fadeOut {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-panel">
            <div class="panel-header">
                <span>ИНЖЕНЕРНЫЙ ОТСЕК</span>
            </div>
            
            <div class="scrollable-content" id="builder-content">
                <!-- Dynamically generated slots go here -->
            </div>

            <div class="panel-header" style="border-top: 2px solid #57534e; font-size: 1rem; padding: 10px 15px;">ТТХ МАШИНЫ</div>
            <div style="padding: 15px; font-size: 0.85rem; color: #d6d3d1; background: #1c1917;" id="vehicle-stats">
                <!-- Stats injected by JS -->
            </div>

            <div class="action-bar">
                <button id="btn-garage" class="secondary" style="display:none;">В Ангар</button>
                <button id="btn-deploy">На Полигон</button>
            </div>
        </div>

        <div id="game-view">
            <div id="mode-indicator">Режим: Ангар (Настройка)</div>
            
            <div id="hud">
                <div class="hud-panel">
                    <div style="color:#a8a29e; font-size:0.9rem;">СТРУКТУРА КОРПУСА</div>
                    <div class="bar-container"><div id="hp-bar" class="bar-fill"></div></div>
                    <div id="hud-extra" style="margin-top:8px;font-size:.8rem;color:#a8a29e;line-height:1.5"></div>
                </div>
                
                <div class="hud-panel" style="font-size: 0.85rem; color: #a8a29e;">
                    <strong style="color:#f5f5f4;">Управление:</strong><br>
                    W,A,S,D - Движение<br>
                    Мышь - Прицеливание (все башни)<br>
                    ЛКМ - Залп из всех орудий<br>ПКМ - Захват цели (враг / точка)<br>X - Сброс цели<br>Колесо мыши, +/- - Зум<br>R - ремонт (если куплен)
                </div>
            </div>

            <div id="messages"></div>
            
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <script>
        // Socket.io подключение (минимальное вмешательство)
        let socket = null;
        let myPlayerId = null;
        const remotePlayers = new Map();

        if (typeof io !== 'undefined') {
            socket = io();
            socket.on('connect', () => {
                console.log('Подключено к серверу мультиплеера');
            });
            socket.on('disconnect', () => {
                console.log('Отключено от сервера');
            });
            socket.on('playerJoined', (data) => {
                myPlayerId = data.id;
                console.log('Мой ID:', myPlayerId);
                // Обновляем ID игрока если он уже создан
                if (playerVehicle) {
                    playerVehicle.id = myPlayerId;
                }
            });
            socket.on('newPlayer', (playerData) => {
                if (playerData.id !== myPlayerId) {
                    // Проверяем что игрока ещё нет
                    if (!remotePlayers.has(playerData.id)) {
                        const remoteVehicle = new Vehicle(playerData.x, playerData.y, playerData.config, false, playerData.team);
                        remoteVehicle.id = playerData.id;
                        remoteVehicle.hp = playerData.hp;
                        remoteVehicle.maxHp = playerData.maxHp;
                        remoteVehicle.angle = playerData.angle;
                        remoteVehicle.isRemote = true;
                        remotePlayers.set(playerData.id, remoteVehicle);
                        console.log('Игрок присоединился:', playerData.id);
                    }
                }
            });
            socket.on('playersList', (players) => {
                console.log('Получен список игроков:', players.length);
                players.forEach(playerData => {
                    if (playerData.id !== myPlayerId && !remotePlayers.has(playerData.id)) {
                        const remoteVehicle = new Vehicle(playerData.x, playerData.y, playerData.config, false, playerData.team);
                        remoteVehicle.id = playerData.id;
                        remoteVehicle.hp = playerData.hp;
                        remoteVehicle.maxHp = playerData.maxHp;
                        remoteVehicle.angle = playerData.angle;
                        remoteVehicle.isRemote = true;
                        remotePlayers.set(playerData.id, remoteVehicle);
                        console.log('Добавлен существующий игрок:', playerData.id);
                    }
                });
            });
            socket.on('playerMoved', (data) => {
                const remotePlayer = remotePlayers.get(data.id);
                if (remotePlayer) {
                    remotePlayer.x = data.x;
                    remotePlayer.y = data.y;
                    remotePlayer.angle = data.angle;
                    remotePlayer.vx = data.vx;
                    remotePlayer.vy = data.vy;
                }
            });
            socket.on('playerRemoved', (data) => {
                remotePlayers.delete(data.id);
                // Удаляем из entities если там есть
                GameState.entities = GameState.entities.filter(e => e.id !== data.id);
            });
            socket.on('projectileFired', (data) => {
                if (data.playerId !== myPlayerId) {
                    // Создаём снаряд от другого игрока
                    const proj = new Projectile(data.x, data.y, data.angle, data.weaponData, data.team, null);
                    GameState.projectiles.push(proj);
                }
            });
            socket.on('playerHit', (data) => {
                const remotePlayer = remotePlayers.get(data.targetId);
                if (remotePlayer) {
                    remotePlayer.hp = data.hp;
                    remotePlayer.mods = data.mods;
                    remotePlayer.flood = data.flood;
                    remotePlayer.fire = data.fire;
                }
            });
            socket.on('playerDied', (data) => {
                const remotePlayer = remotePlayers.get(data.id);
                if (remotePlayer) {
                    remotePlayer.hp = 0;
                    remotePlayer.dead = data.cause;
                    remotePlayer.active = false;
                }
            });
            socket.on('botsUpdate', (botsData) => {
                // Боты убраны - игнорируем
            });
        }

        // Size ratings: 1 = Light, 2 = Medium, 3 = Heavy
        const DB = {
            hulls: [
                { id: 'h_buggy', name: 'Багги "Разведчик"', terrain: 'land', mass: 1500, hp: 320, armor: 10, drag: 0.92, size: {w: 25, l: 45}, drawType: 'car', desc: 'Очень быстрый, но уязвимый. Только для суши.',
                  mounts: [{id: 'm1', size: 1, x: 0, y: -5, name: 'Крыша'}, {id: 'm2', size: 1, x: 0, y: 14, name: 'Багажник'}] },
                  
                { id: 'h_tank_med', name: 'Средний Танк Т-55', terrain: 'land', mass: 35000, hp: 800, armor: 60, drag: 0.88, size: {w: 40, l: 75}, drawType: 'tank', desc: 'Баланс брони и скорости.',
                  mounts: [{id: 'm1', size: 2, x: 0, y: -5, name: 'Главная башня'}] },
                  
                { id: 'h_tank_heavy', name: 'Сверхтяжелый Танк', terrain: 'land', mass: 85000, hp: 2000, armor: 150, drag: 0.82, size: {w: 55, l: 100}, drawType: 'tank', desc: 'Медленный сухопутный монстр.',
                  mounts: [
                      {id: 'm1', size: 3, x: 0, y: -20, name: 'Основая башня'}, 
                      {id: 'm2', size: 1, x: 15, y: 25, name: 'Спонсон Пр.'},
                      {id: 'm3', size: 1, x: -15, y: 25, name: 'Спонсон Лев.'}
                  ]},

                { id: 'h_boat_patrol', name: 'Патрульный Катер', terrain: 'water', mass: 18000, hp: 750, armor: 25, drag: 0.96, size: {w: 30, l: 90}, drawType: 'boat', desc: 'Быстрый речной катер.',
                  mounts: [
                      {id: 'm1', size: 2, x: 0, y: -25, name: 'Нос'}, 
                      {id: 'm2', size: 1, x: 0, y: 30, name: 'Корма'},
                      {id: 'm3', size: 1, x: 12, y: 0, name: 'Пр. Борт'},
                      {id: 'm4', size: 1, x: -12, y: 0, name: 'Лев. Борт'}
                  ]},
                  
                { id: 'h_cruiser', name: 'Ударный Крейсер', terrain: 'water', mass: 250000, hp: 5000, armor: 120, drag: 0.94, size: {w: 60, l: 220}, drawType: 'ship', desc: 'Владыка морей. Множество слотов.',
                  mounts: [
                      {id: 'm1', size: 3, x: 0, y: -70, name: 'ГК Нос'},
                      {id: 'm2', size: 3, x: 0, y: 60, name: 'ГК Корма'},
                      {id: 'm3', size: 2, x: 25, y: -10, name: 'Пр. Борт'},
                      {id: 'm4', size: 2, x: -25, y: -10, name: 'Лев. Борт'}
                  ]},

                { id: 'h_hover', name: 'Судно на Возд. Подушке', terrain: 'amphibious', mass: 12000, hp: 350, armor: 10, drag: 0.95, size: {w: 45, l: 70}, drawType: 'hover', desc: 'Перемещается и по суше, и по воде.',
                  mounts: [{id: 'm1', size: 2, x: 0, y: -10, name: 'Центр. Слот'}] }
            ],

            engines: [
                { id: 'e_gas', name: 'Бензиновый ДВС', mass: 500, power: 300000, icon: '⚡', desc: 'Легкий и дешевый.' },
                { id: 'e_diesel', name: 'Дизель V12', mass: 2500, power: 1200000, icon: '⚙️', desc: 'Надежный танковый двигатель.' },
                { id: 'e_turbine', name: 'Газовая Турбина', mass: 1800, power: 2500000, icon: '🔥', desc: 'Огромная мощность, малый вес.' },
                { id: 'e_reactor', name: 'Морской Реактор', mass: 25000, power: 15000000, icon: '☢️', desc: 'Только для крупных кораблей.' }
            ],

            weapons: [
                // Light (Size 1)
                { id: 'w_mg', name: 'Пулемет 12.7мм', size: 1, type: 'kinetic', mass: 200, dmg: 8, pen: 15, reload: 0.1, vel: 1200, range: 500, turn: 3.0, icon: 'M', desc: 'Высокая скорострельность, слабый урон.', color: '#fbbf24', length: 15, barrelW: 2 },
                { id: 'w_atgm', name: 'ПТУР "Корнет"', size: 1, type: 'missile', mass: 350, dmg: 350, pen: 400, reload: 4.0, vel: 400, range: 1000, turn: 1.5, icon: '🚀', desc: 'Самонаводящаяся ракета.', color: '#ef4444', length: 12, barrelW: 6, isTurreted: true },
                
                // Medium (Size 2)
                { id: 'w_auto30', name: 'Автопушка 30мм', size: 2, type: 'kinetic', mass: 1500, dmg: 25, pen: 45, reload: 0.25, vel: 1000, range: 700, turn: 2.0, icon: '30', desc: 'Эффективна против легкой техники.', color: '#fbbf24', length: 30, barrelW: 4 },
                { id: 'w_cannon76', name: 'Пушка 76мм', size: 2, type: 'kinetic', mass: 3000, dmg: 120, pen: 110, reload: 2.5, vel: 850, range: 900, turn: 1.2, icon: '76', desc: 'Стандартное танковое орудие.', color: '#f59e0b', length: 40, barrelW: 6 },
                { id: 'w_rocket_pod', name: 'РСЗО "Град" (блок)', size: 2, type: 'rocket', mass: 2000, dmg: 80, pen: 30, reload: 0.3, burst: 10, burstReload: 8.0, vel: 600, range: 1200, turn: 1.0, icon: '🎆', desc: 'Выпускает рой неуправляемых ракет.', color: '#f97316', length: 20, barrelW: 15, isBox: true },

                // Heavy (Size 3)
                { id: 'w_cannon152', name: 'Орудие 152мм', size: 3, type: 'kinetic', mass: 8000, dmg: 450, pen: 220, reload: 7.0, vel: 750, range: 1200, turn: 0.5, icon: '152', desc: 'Огромный урон, долгая перезарядка.', color: '#f59e0b', length: 60, barrelW: 9 },
                { id: 'w_naval', name: 'Морская Батарея (2х 203мм)', size: 3, type: 'kinetic', mass: 45000, dmg: 400, pen: 250, reload: 0.5, burst: 2, burstReload: 6.0, vel: 900, range: 2000, turn: 0.3, icon: '⚓', desc: 'Сдвоенная корабельная башня.', color: '#fbbf24', length: 70, barrelW: 8, dual: true },
                { id: 'w_cruise', name: 'Крылатая Ракета', size: 3, type: 'missile', mass: 12000, dmg: 1500, pen: 1000, reload: 15.0, vel: 300, range: 3000, turn: 0.5, icon: '☢️', desc: 'Медленная, но уничтожает почти всё.', color: '#ef4444', length: 40, barrelW: 12, isBox: true }
            ]
        };

        let currentConfig = {
            hull: DB.hulls[1],
            engine: DB.engines[1],
            weapons: { 'm1': DB.weapons[3] }, armor: {}
        };

        const GameState = {
            mode: 'garage',
            keys: {},
            mouse: { x: 0, y: 0, down: false, worldX: 0, worldY: 0 },
            camera: { x: 0, y: 0, zoom: 1 },
            entities: [],
            particles: [],
            projectiles: [],
            lastTime: 0,
            activeSlot: null // For UI
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let playerVehicle = null;

        function renderUI() {
            const container = document.getElementById('builder-content');
            container.innerHTML = '';

            // Helper to create slots
            const createSlot = (id, title, selectedItem, itemsList, type, maxAllowedSize = 3) => {
                const div = document.createElement('div');
                div.className = 'slot-container';
                
                const isOpen = GameState.activeSlot === id;
                const header = document.createElement('div');
                header.className = `slot-header ${isOpen ? 'active' : ''}`;
                header.innerHTML = `<span>${title}</span> <span style="color:#fbbf24">${selectedItem ? selectedItem.name : 'ПУСТО'}</span>`;
                header.onclick = () => {
                    GameState.activeSlot = isOpen ? null : id;
                    renderUI();
                };
                div.appendChild(header);

                const body = document.createElement('div');
                body.className = `slot-body ${isOpen ? 'open' : ''}`;

                itemsList.forEach(item => {
                    // Filter weapons by mount size
                    if (type === 'weapon' && item.size > maxAllowedSize || (item.minMass || 0) > currentConfig.hull.mass) return;

                    const isSelected = selectedItem && selectedItem.id === item.id;
                    const card = document.createElement('div');
                    card.className = `component-card ${isSelected ? 'selected' : ''}`;
                    
                    let statsHtml = '';
                    if(item.mass) statsHtml += `<div class="stat-item">Масса: <span>${item.mass}кг</span></div>`;
                    if(type === 'hull') {
                        statsHtml += `<div class="stat-item">Среда: <span>${item.terrain === 'water' ? 'Вода' : (item.terrain === 'land' ? 'Суша' : 'Амфибия')}</span></div>`;
                        statsHtml += `<div class="stat-item">Слотов: <span>${item.mounts.length}</span></div>`;
                    }
                    statsHtml += `<div class="stat-item">Цена: <span>${item.cost} PP${GameState.owned.has(item.id) ? ' ✓ куплено' : ''}</span></div>`;
                    if(type === 'armor') statsHtml += `<div class="stat-item">Броня: <span>+${item.add}</span></div><div class="stat-item">Масса: <span>${armorMass(item, currentConfig.hull)}кг</span></div>${item.era ? '<div class="stat-item">Заряды: <span>' + item.era + '</span></div>' : ''}`;
                    if(type === 'engine') statsHtml += `<div class="stat-item">Мощность: <span>${(item.power/1000).toFixed(0)}к</span></div>`;
                    if(type === 'weapon') {
                        statsHtml += `<div class="stat-item">Урон: <span>${item.dmg}</span></div>`;
                        if(item.burst) statsHtml += `<div class="stat-item">Очередь: <span>${item.burst}</span></div>`;
                        else statsHtml += `<div class="stat-item">КД: <span>${item.reload}с</span></div>`;
                    }

                    card.innerHTML = `
                        <div class="component-icon">${item.icon || (type==='hull'?'H':'')}</div>
                        <div class="component-info">
                            <h4>${item.name}</h4>
                            <div style="font-size: 0.75rem; color:#78716c; margin-bottom: 4px;">${item.desc}</div>
                            <div class="component-stats">${statsHtml}</div>
                        </div>
                    `;
                    
                    card.onclick = () => selectComponent(type, item, id);
                    body.appendChild(card);
                });
                
                // Add "Remove" button for optional slots
                if(type === 'weapon' || type === 'armor') {
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'secondary';
                    removeBtn.style.width = '100%';
                    removeBtn.style.padding = '5px';
                    removeBtn.style.marginTop = '10px';
                    removeBtn.innerText = type === 'armor' ? 'Снять броню' : 'Снять вооружение';
                    removeBtn.onclick = () => selectComponent(type, null, id);
                    body.appendChild(removeBtn);
                }

                div.appendChild(body);
                container.appendChild(div);
            };

            // 1. Chassis Slot

        function selectComponent(type, item, slotId) {
            if (GameState.mode !== 'garage') return;
            if (item && !GameState.owned.has(item.id)) {
                if (GameState.pp < item.cost) { showMessage('Не хватает PP: нужно ' + item.cost); return; }
                shopDialog(item, () => { GameState.pp -= item.cost; GameState.owned.add(item.id); savePP(); selectComponent(type, item, slotId); });
                return;
            }

            if (type === 'hull') {
                currentConfig.hull = item;
                // Clear incompatible weapons
                const newWeapons = {};
                item.mounts.forEach(m => {
                    const oldWep = currentConfig.weapons[m.id];
                    if (oldWep && oldWep.size <= m.size) {
                        newWeapons[m.id] = oldWep;
                    }
                });
                currentConfig.weapons = newWeapons;
                GameState.activeSlot = null; // close tabs
            } 
            else if (type === 'engine') {
                currentConfig.engine = item;
            } 
            else if (type === 'armor') {
                const z = slotId.replace('slot_a_', '');
                if (item === null) delete currentConfig.armor[z]; else currentConfig.armor[z] = item;
            }
            else if (type === 'weapon') {
                const mountId = slotId.replace('slot_w_', '');
                if (item === null) {
                    delete currentConfig.weapons[mountId];
                } else {
                    currentConfig.weapons[mountId] = item;
                }
            }

            renderUI();
            if (GameState.mode === 'garage') createGarageVehicle();
        }

            let firePower = 0;
            
            Object.values(currentConfig.weapons).forEach(w => {

                firePower += dps;

    if (this.ring) { ctx.strokeStyle = this.color; ctx.lineWidth = 1 + 3 * a; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, 6.3); ctx.stroke(); }
    else { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(.1, this.size), 0, 6.3); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
}

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x; this.y = y; this.text = text; this.color = color; this.life = 1.2;
            }
            update(dt) {
                this.y -= 30 * dt; this.life -= dt;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.font = 'bold 16px "Share Tech Mono"';
                ctx.fillText(this.text, this.x - ctx.measureText(this.text).width/2, this.y);
                ctx.globalAlpha = 1;
            }
        }

function P(x,y,vx,vy,l,c,s,o){GameState.particles.push(new Particle(x,y,vx,vy,l,c,s,o));}
function createExplosion(x,y,r,color,count){
  for(let i=0;i<count;i++){const a=Math.random()*6.283,sp=Math.random()*r*3.2;
    P(x,y,Math.cos(a)*sp,Math.sin(a)*sp,.25+Math.random()*.5,i%3?'#f97316':'#fde047',2+Math.random()*r*.12,{add:true,grow:r*.3});}
  for(let i=0;i<count*.6;i++){const a=Math.random()*6.283,sp=Math.random()*r*1.2;
    P(x,y,Math.cos(a)*sp,Math.sin(a)*sp,1.2+Math.random()*1.6,'rgba(40,36,33,.5)',3+Math.random()*r*.1,{grow:r*.25,rise:14,drag:.97});}
  for(let i=0;i<count*.4;i++){const a=Math.random()*6.283;P(x,y,Math.cos(a)*r*6,Math.sin(a)*r*6,.4,'#fff7ae',1.5,{drag:.9,add:true});}
  P(x,y,0,0,.4,'rgba(255,220,150,.8)',r*.3,{ring:true,grow:r*5});
}
function splash(x,y,s){
  for(let i=0;i<10+s*.4;i++){const a=Math.random()*6.283,sp=Math.random()*s*2;P(x,y,Math.cos(a)*sp,Math.sin(a)*sp,.5+Math.random()*.6,'rgba(220,240,255,.8)',2+Math.random()*s*.12,{grow:s*.1,rise:20});}
  P(x,y,0,0,.8,'rgba(255,255,255,.7)',s*.2,{ring:true,grow:s*3});
}
function dust(x,y,s){for(let i=0;i<6;i++){const a=Math.random()*6.283;P(x,y,Math.cos(a)*s,Math.sin(a)*s,.8,'rgba(120,100,60,.5)',3+Math.random()*s*.2,{grow:s*.3,drag:.92});}}

        function createMessage(x, y, text, color) {
            GameState.particles.push(new FloatingText(x, y, text, color));
        }

        function resizeCanvas() {
            const container = document.getElementById('game-view');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function initGame() {
            window.addEventListener('resize', resizeCanvas);
            
            window.addEventListener('keydown', e => { GameState.keys[e.key] = true;
                if (e.key === '+' || e.key === '=') GameState.zoomT = Math.min(2.5, (GameState.zoomT || 1) * 1.15);
                if (e.key === '-') GameState.zoomT = Math.max(.25, (GameState.zoomT || 1) / 1.15);
                if ('xXчЧ'.includes(e.key)) GameState.lock = null;
                if ('rRкК'.includes(e.key)) startRepair(); });
            window.addEventListener('keyup', e => GameState.keys[e.key] = false);
            
            canvas.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect();
                GameState.mouse.x = e.clientX - rect.left;
                GameState.mouse.y = e.clientY - rect.top;
                // Convert screen to world space
                GameState.mouse.worldX = (GameState.mouse.x - GameState.camera.x) / GameState.camera.zoom;
                GameState.mouse.worldY = (GameState.mouse.y - GameState.camera.y) / GameState.camera.zoom;
            });
            canvas.addEventListener('mousedown', () => GameState.mouse.down = true);
            canvas.addEventListener('mouseup', () => GameState.mouse.down = false);
            canvas.addEventListener('wheel', e => { e.preventDefault(); GameState.zoomT = Math.max(.25, Math.min(2.5, (GameState.zoomT || 1) * Math.exp(-e.deltaY * .0012))); }, {passive: false});
            canvas.addEventListener('contextmenu', e => {
                e.preventDefault(); if (GameState.mode !== 'combat') return;
                const mx = GameState.mouse.worldX, my = GameState.mouse.worldY; let best = null, bd = 1e9;
                GameState.entities.forEach(en => { if (en instanceof Vehicle && en.team !== 1 && en.hp > 0) { const d = Math.hypot(en.x - mx, en.y - my); if (d < Math.max(en.hull.size.l * .7, 40 / GameState.camera.zoom) && d < bd) { bd = d; best = en; } } });
                GameState.lock = best ? {type: 'entity', entity: best} : {type: 'point', x: mx, y: my};
                showMessage(best ? 'Цель захвачена: ' + best.hull.name : 'Точка захвачена');
            });

            document.getElementById('btn-deploy').addEventListener('click', () => switchMode('combat'));
            document.getElementById('btn-garage').addEventListener('click', () => switchMode('garage'));

            renderUI();
            switchMode('garage');
            requestAnimationFrame(gameLoop);
        }

        function switchMode(mode) {
            if (mode === 'combat' && GameState.mode === 'garage') {
                if (GameState.pp < SORTIE) { showMessage('Недостаточно PP для вылета!'); return; }
                GameState.pp -= SORTIE; GameState.kit = false;
                if (GameState.repairBuy) { if (GameState.pp >= REPAIR) { GameState.pp -= REPAIR; GameState.kit = true; } else showMessage('Не хватает PP на ремонт'); }
                savePP();
                Object.keys(currentConfig.weapons).forEach(k => { const w = currentConfig.weapons[k]; if (w && (w.minMass || 0) > currentConfig.hull.mass) delete currentConfig.weapons[k]; });
            }
            if (mode === 'garage' && GameState.pp < SORTIE) { GameState.pp = SORTIE; savePP(); showMessage('Аварийный резерв: ' + SORTIE + ' PP'); }
            GameState.mode = mode;
            GameState.entities = [];
            GameState.projectiles = [];
            GameState.particles = [];
            
            const modeInd = document.getElementById('mode-indicator');
            const hud = document.getElementById('hud');
            
            resizeCanvas();

            if (mode === 'garage') {
                modeInd.innerText = 'РЕЖИМ: СБОРКА';
                modeInd.style.color = '#fbbf24';
                hud.style.display = 'none';
                document.getElementById('btn-garage').style.display = 'none';
                document.getElementById('btn-deploy').style.display = 'block';
                document.getElementById('ui-panel').style.display = 'flex';
                
                GameState.camera = { x: canvas.width/2, y: canvas.height/2, zoom: 1 }; GameState.zoomT = 1; GameState.lock = null;
                createGarageVehicle();
            } else if (mode === 'combat') {
                modeInd.innerText = 'РЕЖИМ: ПОЛИГОН';
                modeInd.style.color = '#ef4444';
                hud.style.display = 'block';
                document.getElementById('btn-garage').style.display = 'block';
                document.getElementById('btn-deploy').style.display = 'none';
                document.getElementById('ui-panel').style.display = 'none';
                
                resizeCanvas();
                
                // Spawn based on terrain
                const sp0 = findSpawn(currentConfig.hull, null);
                playerVehicle = new Vehicle(sp0.x, sp0.y, currentConfig, true, 1);
                GameState.camera.x = canvas.width / 2 - sp0.x; GameState.camera.y = canvas.height / 2 - sp0.y;
                GameState.entities.push(playerVehicle);
                
                console.log('Игрок создан, entities:', GameState.entities.length, 'playerVehicle:', playerVehicle);
                
                // Отправляем данные игрока на сервер (даже если ID ещё не пришёл)
                if (socket) {
                    socket.emit('joinGame', {
                        x: playerVehicle.x,
                        y: playerVehicle.y,
                        angle: playerVehicle.angle,
                        hull: playerVehicle.hull,
                        hp: playerVehicle.hp,
                        maxHp: playerVehicle.maxHp,
                        team: playerVehicle.team,
                        config: currentConfig
                    });
                }
                
                // Боты убраны
                updateHUD();
                showMessage("Остров в океане. ПКМ - захват цели, колесо - зум.");
            }
        }

        function createGarageVehicle() {
            refreshPP();
            playerVehicle = new Vehicle(0, 0, currentConfig, false, 1);
            playerVehicle.angle = -Math.PI / 6;
            GameState.entities = [playerVehicle];
        }

        function createTarget() {
            // Find a random config matching player's terrain preference roughly
            const terrain = currentConfig.hull.terrain === 'water' ? 'water' : 'land';
            const possibleHulls = DB.hulls.filter(h => h.terrain === terrain || h.terrain === 'amphibious');
            
            const eHull = possibleHulls[Math.floor(Math.random() * possibleHulls.length)];
            const eConfig = { hull: eHull, engine: DB.engines[0], weapons: {} };
            
            eHull.mounts.forEach(m => {
                const possibleWeps = DB.weapons.filter(w => w.size <= m.size && w.type !== 'ballistic' && (w.minMass || 0) <= eHull.mass);
                eConfig.weapons[m.id] = possibleWeps[Math.floor(Math.random() * possibleWeps.length)];
            });

            const pv = playerVehicle && playerVehicle.hp > 0 ? playerVehicle : null, sp = findSpawn(eHull, pv, 900, 1700) || findSpawn(eHull, null);
            const target = new Vehicle(sp.x, sp.y, eConfig, false, 2);
            GameState.entities.push(target);
        }

function updateHUD() {
  if (!playerVehicle || GameState.mode !== 'combat') return;
  refreshPP();
  const v = playerVehicle, hpPct = Math.max(0, v.hp / v.maxHp * 100), pc = x => Math.round(x * 100);
  const hpBar = document.getElementById('hp-bar');
  hpBar.style.width = `${hpPct}%`;
  hpBar.style.backgroundColor = hpPct > 50 ? '#22c55e' : (hpPct > 25 ? '#f59e0b' : '#ef4444');
  document.getElementById('hud-extra').innerHTML = `Скорость: <b style="color:#fbbf24">${Math.abs(v.fwdSpeed * 3.6).toFixed(0)} км/ч</b><br>Двигатель: ${pc(v.mods.engine)}% · Ход: ${pc(v.mods.tracks)}%<br>Экипаж: ${pc(v.mods.crew)}%` +
    (v.flood > 0.01 ? `<br><span style="color:#38bdf8">Затопление: ${pc(v.flood)}%</span>` : '') + (v.fire ? '<br><span style="color:#ef4444">ПОЖАР!</span>' : '') +
    (v.repairT > 0 ? '<br><span style="color:#4ade80">РЕМОНТ: ' + v.repairT.toFixed(1) + ' с</span>' : (GameState.kit ? '<br>R - ремонт (готов)' : ''));
}

function makePat(base,dots,sz=256){const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,sz,sz);
  for(let i=0;i<350;i++){g.fillStyle=dots[i%dots.length];g.globalAlpha=.22;const x=Math.random()*sz,y=Math.random()*sz,r=1+Math.random()*8;
    for(const ox of[-sz,0,sz])for(const oy of[-sz,0,sz]){g.beginPath();g.arc(x+ox,y+oy,r,0,6.3);g.fill();}}
  return c;}
const PAT={};
function drawMap(ctx){
  if(!PAT.g){PAT.g=ctx.createPattern(makePat('#2c3b17',['#3f5622','#1c2a0e','#566a2e']),'repeat');
    PAT.s=ctx.createPattern(makePat('#6b5c32',['#85763f','#4d4223']),'repeat');
    PAT.w=ctx.createPattern(makePat('#0d2b4d',['#15416d','#08203a','#1f5a8f']),'repeat');}
  const z=GameState.camera.zoom,L=-GameState.camera.x/z-40,R=(canvas.width-GameState.camera.x)/z+40,T=-GameState.camera.y/z-40,B=(canvas.height-GameState.camera.y)/z+40,t=performance.now()/1000;
  if(L<-24){ctx.fillStyle=PAT.g;ctx.fillRect(L,T,Math.min(R,-24)-L,B-T);}
  ctx.fillStyle=PAT.s;ctx.fillRect(-24,T,24,B-T);
  if(R>0){const x0=Math.max(L,0);ctx.fillStyle=PAT.w;ctx.fillRect(x0,T,R-x0,B-T);
    const sg=ctx.createLinearGradient(0,0,90,0);sg.addColorStop(0,'rgba(90,190,180,.65)');sg.addColorStop(1,'rgba(90,190,180,0)');
    ctx.fillStyle=sg;ctx.fillRect(0,T,90,B-T);
    ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1.5;ctx.beginPath();
    for(let gx=Math.floor(x0/70)*70;gx<R;gx+=70)for(let gy=Math.floor(T/50)*50;gy<B;gy+=50){
      const ox=Math.sin(gx*.13+gy*.07+t*1.3)*10,oy=Math.cos(gx*.05+t)*4;ctx.moveTo(gx+ox,gy+oy);ctx.quadraticCurveTo(gx+ox+10,gy+oy-4,gx+ox+20,gy+oy);}
    ctx.stroke();}
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.beginPath();
  for(let y=Math.floor(T/10)*10;y<B;y+=10){const x=Math.sin(y*.05+t*1.6)*3+1;y===Math.floor(T/10)*10?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke();
}
function drawGarage(ctx){
  const g=ctx.createRadialGradient(0,0,10,0,0,460);g.addColorStop(0,'#443e34');g.addColorStop(1,'rgba(28,25,23,0)');
  ctx.fillStyle=g;ctx.fillRect(-canvas.width,-canvas.height,canvas.width*2,canvas.height*2);
  ctx.strokeStyle='rgba(251,191,36,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,200,0,6.3);ctx.stroke();
  ctx.setLineDash([4,10]);ctx.beginPath();ctx.arc(0,0,250,0,6.3);ctx.stroke();ctx.setLineDash([]);
}

        function gameLoop(timestamp) {
            if (!GameState.lastTime) GameState.lastTime = timestamp;
            let dt = (timestamp - GameState.lastTime) / 1000;
            GameState.lastTime = timestamp;
            if (dt > 0.05) dt = 0.05;

            // Update
            // Добавляем удалённых игроков в entities для обновления
            remotePlayers.forEach(v => {
                if (!GameState.entities.includes(v)) {
                    GameState.entities.push(v);
                }
            });
            GameState.entities.forEach(e => e.active && e.update(dt));
            GameState.projectiles.forEach(p => p.active && p.update(dt));
            GameState.particles.forEach(p => p.life > 0 && p.update(dt));

            GameState.entities = GameState.entities.filter(e => e.active);
            // Временно убираем фильтрацию по ID для отладки
            // GameState.entities = GameState.entities.filter(e => {
            //     if (e === playerVehicle) return true;
            //     if (!e.id) return true;
            //     if (e.id === myPlayerId) return true;
            //     return remotePlayers.has(e.id);
            // });
            if (GameState.mode === 'combat') collideVehicles();
            GameState.projectiles = GameState.projectiles.filter(p => p.active);
            GameState.particles = GameState.particles.filter(p => p.life > 0);

            // Camera follow player
            if (GameState.mode === 'combat' && playerVehicle) {
                const z = GameState.camera.zoom += ((GameState.zoomT || 1) - GameState.camera.zoom) * Math.min(1, dt * 8);
                const targetCamX = canvas.width/2 - playerVehicle.x * z;
                const targetCamY = canvas.height/2 - playerVehicle.y * z;
                GameState.camera.x += (targetCamX - GameState.camera.x) * dt * 5;
                GameState.camera.y += (targetCamY - GameState.camera.y) * dt * 5;
                
                // Update mouse world pos based on new camera
                GameState.mouse.worldX = (GameState.mouse.x - GameState.camera.x) / GameState.camera.zoom;
                GameState.mouse.worldY = (GameState.mouse.y - GameState.camera.y) / GameState.camera.zoom;
            }

            // Garage animation
            if (GameState.mode === 'garage' && playerVehicle) {
                playerVehicle.angle += dt * 0.3;
                playerVehicle.weaponSystems.forEach(ws => {
                    ws.angle = playerVehicle.angle + Math.sin(timestamp/1000) * 0.5;
                });
            }

            // Draw
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            GameState.shake = (GameState.shake || 0) * Math.exp(-6 * dt);
            ctx.translate(GameState.camera.x + (Math.random() - .5) * GameState.shake, GameState.camera.y + (Math.random() - .5) * GameState.shake);
            ctx.scale(GameState.camera.zoom, GameState.camera.zoom);

            if (GameState.mode === 'combat') drawMap2(ctx); else drawGarage(ctx);

            GameState.entities.filter(e => e.hp <= 0).forEach(e => e.draw(ctx));
            GameState.entities.filter(e => e.hp > 0).forEach(e => e.draw(ctx));
            GameState.particles.forEach(p => p.draw(ctx));
            GameState.projectiles.forEach(p => p.draw(ctx));
            drawLock(ctx); drawMini();

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        window.onload = initGame;
    </script>
